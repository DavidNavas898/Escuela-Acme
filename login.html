<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="login-styles.css">
    <script src="localstorage.js"></script>
    <title>AcmeSchool - Iniciar Sesión</title>
</head>
<body>

    <nav class="navbar">
        <span class="brand">AcmeSchool</span>
        <a href="resolver.html" class="nav-link">Resolver examen</a>
    </nav>
    <main class="main-container">
        <div class="login-card">
            <section class="card-info">
                <div class="tag">Módulo Privado</div>
                <h1>Gestiona usuarios y exámenes con una cuenta autorizada.</h1>
                <p>Ingresa para administrar el banco de exámenes de Acme School.</p>
                <p>Los estudiantes pueden resolver pruebas desde el módulo público.</p>
            </section>

            <section class="card-form">
                <h2>Iniciar sesión</h2>
                
                <form id="miFormulario" method="POST">
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="admin@acme.edu" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="demo-note">
                        Usuario demo: admin@acme.edu / Admin123
                    </div>

                    <button type="submit" class="btn-submit">Entrar</button>
                </form>
            </section>

        </div>
    </main>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="login-controller.js" defer></script>
</body>
</html>
